# grounding-domains.yaml | Vitalia Kit v0.5.0
# Atualizado em: 12-08-2026 21:26(GMT-04:00)
#
# Define os domínios onde verificação externa é OBRIGATÓRIA.
# O agente NÃO pode usar conhecimento interno de treinamento nestes domínios.
#
# Customizações por projeto: via .vitalia/memory/session/data/grounding-domains.jsonl (append-only)
# View consolidada: .vitalia/memory/session/grounding-domains-local.yaml (GERADO — não editar)

version: "1.0"
last_updated: "12-08-2026"

domains:

  llm_models:
    description: "Versões, capacidades, benchmarks e preços de modelos LLM"
    mandatory_search: true
    authoritative_sources:
      - "ai.google.dev/gemini-api/docs"       # Google Gemini
      - "platform.openai.com/docs"            # OpenAI GPT
      - "docs.anthropic.com"                  # Anthropic Claude
      - "huggingface.co/docs"                 # HuggingFace (open models)
    examples:
      - "gemini-2.5-pro suporta X tokens de contexto"
      - "claude-3.5-sonnet tem Y de context window"

  python_packages:
    description: "Versões de pacotes PyPI, compatibilidade, breaking changes"
    mandatory_search: true
    authoritative_sources:
      - "pypi.org"                            # versão atual de qualquer pacote
      - "docs.[pacote].org ou .dev ou .io"    # documentação oficial do pacote
    examples:
      - "Django 5.x exige Python 3.10+"
      - "SQLAlchemy 2.0 mudou API de session"
      - "requests 2.32 tem CVE X"

  external_apis:
    description: "Endpoints, schemas, rate limits, autenticação de APIs externas"
    mandatory_search: true
    authoritative_sources:
      - "Documentação oficial da API referenciada (sempre URL específica)"
    examples:
      - "Stripe usa HMAC-SHA256 para webhooks"
      - "OpenAI API aceita X parâmetro em Y endpoint"
      - "GitHub Actions tem limite de Z minutos por mês"

  security_practices:
    description: "CVEs, vulnerabilidades, práticas de segurança atuais"
    mandatory_search: true
    authoritative_sources:
      - "cve.mitre.org"                       # banco oficial de CVEs
      - "nvd.nist.gov"                        # National Vulnerability Database
      - "owasp.org"                           # OWASP Top 10 e guidelines
      - "cheatsheetseries.owasp.org"          # cheat sheets específicos
      - "security.snyk.io"                    # vulnerabilidades em pacotes

  regulations:
    description: "LGPD, HIPAA, GDPR, normas de compliance — que evoluem"
    mandatory_search: true
    authoritative_sources:
      - "gov.br/anpd/pt-br"                                          # ANPD — Autoridade Nacional de Proteção de Dados
      - "planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709"   # Texto oficial da LGPD
      - "hhs.gov/hipaa"                                              # HIPAA — EUA
      - "edpb.europa.eu"                                             # GDPR — Europa

  cloud_services:
    description: "Preços, SLAs, limites e recursos de serviços em nuvem"
    mandatory_search: true
    authoritative_sources:
      - "cloud.google.com/pricing"            # Google Cloud Platform
      - "aws.amazon.com/pricing"              # Amazon Web Services
      - "azure.microsoft.com/pricing"         # Microsoft Azure
      - "oracle.com/cloud/pricing"            # Oracle Cloud Infrastructure
      - "digitalocean.com/pricing"            # DigitalOcean
      - "linode.com/pricing"                  # Akamai/Linode
      - "vultr.com/pricing"                   # Vultr

  scientific_claims:
    description: "Afirmações sobre evidências científicas, eficácia de técnicas, benchmarks de pesquisa"
    mandatory_search: true
    authoritative_sources:
      - "pubmed.ncbi.nlm.nih.gov"            # PubMed — literatura científica
      - "cochranelibrary.com"                 # Cochrane — revisões sistemáticas
      - "scholar.google.com"                  # Google Scholar
    note: >-
      INDEPENDENTE do medical-gate. O medical-gate cobre publicação de conteúdo
      clínico para USUÁRIOS FINAIS (pipeline DRAFT→REVIEW→ACTIVE).
      Este domínio cobre afirmações durante PLANEJAMENTO e BRAINSTORMING
      (ex: "técnica X tem 90% de acurácia segundo estudo Y").
      Ambos são necessários — cobrem fases distintas.

# Domínios isentos: conhecimento interno do modelo pode ser usado livremente
exempt_domains:
  - "Sintaxe de linguagem de programação (Python, JS, SQL, Bash, etc.)"
  - "Algoritmos e estruturas de dados fundamentais (ordenação, grafos, etc.)"
  - "Conceitos de arquitetura de software (SOLID, DDD, Clean Architecture, etc.)"
  - "Lógica de negócio específica deste projeto (definida na spec)"
  - "Comandos de terminal e shell (ls, git, grep, awk, etc.)"
  - "Padrões de design de software (Factory, Observer, Strategy, etc.)"
