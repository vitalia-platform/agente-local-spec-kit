description = "Consolida os shards e renderiza o README visual do contexto."

[meta]
version = "0.4.0"
hardware_profile = "lightweight"
domain_gates = []

[hooks]
before = []
after = []

[tools]
required = ["read_file", "run_command"]
optional = []

[context]
reads = [".vitalia/feature.json"]
writes = []

[transport]
preferred = "redis"
redis_key = "vitalia:workflow:session-consolidate"
file_path = ".vitalia/pipeline.json"
session_shard = true

prompt = """
## User Input

```text
{{args}}
```

<!-- session-consolidate.md | Atualizado pela Spec 3.1 -->

# /session-consolidate — Consolidação e Dashboard Visual

{{args}}

---

## Propósito

Responsável por ler os shards, reconstruir o `README.md` (Dashboard Visual) do repositório de contexto e commitar/empurrar a pasta `.vitalia/memory/session/` para a nuvem.

---

## Pipeline

### Passo 1: Pull --rebase
Execute `git -C .vitalia/memory/session pull --rebase`.
Se houver conflito, aborte imediatamente e exiba mensagem solicitando intervenção manual (HITL).

### Passo 2: Invocar Motor de Contexto
Execute `python3 ~/.vitalia/kit/scripts/vitalia_context_engine.py --action consolidate`.
O script vai checar o semáforo. Se estiver bloqueado (abortar), mostre a mensagem de bloqueio para o usuário e encerre. Se prosseguir, ele adquire o lock, regenera o `DASHBOARD.md` e as views.

### Passo 3: Análise de Aprendizados Novos
Leia as entradas de `data/learnings.jsonl`. O LLM deve analisar entradas novas e exibir os aprendizados chave para o usuário no chat.

### Passo 3.5: Curadoria de Domínios de Grounding (HITL)

1. Leia `data/grounding-domains.jsonl` (se existir)
2. Construa o mapa de decisões: para cada entrada `scope_decision`, registre `target_id → scope`
3. Filtre as entradas do tipo `new_domain` e `new_source` que **não possuem** `scope_decision` correspondente (scope pendente)
4. Se **não houver** entradas pendentes → exibir `✅ Grounding: 0 domínios pendentes de curação` e seguir para o Passo 4
5. Se houver entradas pendentes → exibir tabela de curadoria:

```markdown
## 🔍 Novos Domínios de Grounding — Curadoria Necessária

| # | Tipo | Domínio / Fonte | Motivo | Máquina | Data |
|---|---|---|---|---|---|
| 1 | Novo domínio | `nome_dominio` — fonte1, fonte2 | [reason] | [machine_id] | [timestamp] |
| 2 | Nova fonte | `dominio_existente` — nova_fonte | [reason] | [machine_id] | [timestamp] |
```

6. **Rodada A** — usar `ask_question` (is_multi_select: true):
   > "Quais domínios/fontes devem ser promovidos para o **kit global** (todos os projetos)?"
   > Opções: lista de todos os candidatos pendentes (formato: "Domínio: X — Fonte: Y")
   > Não selecionados em A passam para Rodada B

7. **Rodada B** — usar `ask_question` (is_multi_select: true) com o restante:
   > "Quais devem ficar apenas **locais** (somente este projeto)?"
   > Selecionados → scope: "local" | Não selecionados → scope: "rejected"

8. Para cada decisão, fazer **append** em `data/grounding-domains.jsonl`:
   ```bash
   echo '{"type":"scope_decision","target_id":"<id>","scope":"<global|local|rejected>","decided_by":"<machine_id>","timestamp":"<DD-MM-YYYY HH:MM(GMT-04:00)>"}' >> .vitalia/memory/session/data/grounding-domains.jsonl
   ```

9. Para entradas com scope `"global"`:
   - Exibir o diff do que seria adicionado ao `~/.vitalia/kit/config/grounding-domains.yaml`
   - Pedir confirmação HITL explícita antes de editar o arquivo do kit (ele é compartilhado por todos os projetos)
   - Se confirmado: editar o yaml global adicionando o novo domínio/fonte na seção correta

10. Após todas as decisões, invocar novamente o motor de contexto para regenerar `grounding-domains-local.yaml`:
    ```bash
    python3 ~/.vitalia/kit/scripts/vitalia_context_engine.py --action consolidate
    ```

### Passo 4: Análise de Decisões
Leia `data/decisions.jsonl`. O LLM deve realizar análise inteligente para garantir que a visão consolidada faça sentido e preserve o histórico arquitetural.

### Passo 5: Atualização do Histórico
Garanta que `SESSION_HISTORY.md` contemple as entradas consolidadas corretamente.

### Passo 6: Commit de Sincronização
Obtenha seu machine_id (via hostname) e faça:
```bash
git -C .vitalia/memory/session add .
git -C .vitalia/memory/session commit -m "chore: session consolidated by local"
```

### Passo 7: Push
Execute `git -C .vitalia/memory/session push origin main`.
Em caso de falha de rede/autenticação, exiba mensagem de erro (HITL) sugerindo que o usuário rode o comando manualmente.

### Passo 8: Confirmação
Conclua exibindo: `✅ Contexto sincronizado na nuvem` (ou estado pendente, se houve falha no push).
"""
