description = "Protocolo socrático para estruturar features ou requisitos complexos antes da execução."

[meta]
version = "0.4.0"
hardware_profile = "lightweight"
domain_gates = []

[hooks]
before = []
after = []

[tools]
required = ["read_file"]
optional = ["write_file"]

[context]
reads = [".vitalia/feature.json"]
